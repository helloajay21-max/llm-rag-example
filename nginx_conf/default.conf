server {
    listen 80;
    server_name ajaysite.personal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ajaysite.personal;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
